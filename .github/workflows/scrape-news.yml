name: 📰 Scrape Noticias Update
on:
  schedule:
    - cron: '*/60 * * * *'     # Cada 60min
  workflow_dispatch:        # Botón manual

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install deps
      run: |
        pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests beautifulsoup4 lxml unidecode; fi
        playwright install --with-deps chromium
    
    - name: 📰 Scrape → JSON
      run: |
        python trends_scraper.py
        python scraper_cron_lv1.py
        python analyze_news_tags.py
        python scraper_cron_lv2.py

    - name: Commit JSON
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        file_pattern: '*.json'
        commit_message: "📰 Update ${{ github.event.head_commit.timestamp }}"
        skip_fetch: true

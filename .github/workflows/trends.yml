name: 🌐 Trends ES Update

on:
  workflow_dispatch:       # Botón manual

# ← AÑADIDO: Prevenir ejecuciones paralelas
concurrency:
  group: trends-update
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0  # ← AÑADIDO: necesario para rebase
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install deps
      run: |
        pip install playwright requests
        playwright install --with-deps chromium
    
    - name: Scrape Trends → JSON
      run: python trends_scraper.py
    
    - name: Commit JSON
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        file_pattern: '*.json'
        commit_message: "Update trends"
        commit_user_name: github-actions[bot]
        commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
        # ← CAMBIOS IMPORTANTES
        skip_fetch: false  # ← CAMBIADO de true a false
        pull_options: '--rebase --autostash'  # ← AÑADIDO
        push_options: '--force-with-lease'  # ← AÑADIDO: push seguro

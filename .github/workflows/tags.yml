name: Análisis de Tags de Noticias

on:
  schedule:
    # Ejecutar cada 2 horas
    - cron: '0 */2 * * *'

  # Permitir ejecución manual
  workflow_dispatch:

  # Ejecutar en cada push a main (opcional, comentar si no se desea)
  push:
    branches:
      - main

jobs:
  analyze-tags:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Create output directory
      run: |
        mkdir -p tags_json

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests playwright
        playwright install --with-deps chromium

    - name: Run tags analysis
      run: |
        python analyze_news_tags.py
      continue-on-error: false

    - name: Commit JSON
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        file_pattern: '*.json'
        commit_message: "Update trends ${{ github.event.head_commit.timestamp }}"
        skip_fetch: true
